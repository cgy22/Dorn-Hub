<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://dornhub.eu.org/SatornhLogo.png" type="image/png" sizes="161x161">

    <title>Dorn Store - 𣿅国商城</title>
    <meta name="description" content="Dorn Store 商城是大𣿅子IP的数字商品展销平台，提供𣿅国特产、数字藏品与周边商品，支持搜索、查看详情与联系咨询。">
    <meta name="Keywords" content="Dorn,Dornhub,多恩,𣿅国,商城,商品,数字藏品,DornStore">

    <!-- 图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Cloudflare Turnstile -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <!-- Turnstile 统一管理模块 -->
    <script src="https://dornhub.eu.org/resources/turnstile.js"></script>

    <!-- 【分区①】ui.css 内容（精简版） -->
    <style>
        /* ui.css - 统一UI样式与动画效果 */
        @import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap');

        /* ==================== 全局变量 ==================== */
        :root {
            --primary-color: #16DA49;
            --primary-color-rgb: 22, 218, 73;
            --secondary-color: #f3f2f1;
            --card-hover-color: #f8f9fa;
            --text-color: #323130;
            --bg-color: #ffffff;
            --card-bg: #ffffff;
            --header-bg: rgba(255, 255, 255, 0.7);
            --border-color: #edebe9;
            --shadow-color: rgba(0, 0, 0, 0.1);
            --overlay-color: rgba(255, 255, 255, 0.5);
            --header-height: 70px;
            --border-radius: 8px;
            --transition-speed: 0.4s;
            --animation-curve: cubic-bezier(0.05, 0.7, 0.1, 1.0);
        }

        /* ==================== 深色主题 ==================== */
        [data-theme="dark"] {
            --primary-color: #0086f0;
            --primary-color-rgb: 0, 134, 240;
            --secondary-color: #2d2c2c;
            --card-hover-color: #323130;
            --text-color: #ffffff;
            --bg-color: #1e1e1e;
            --card-bg: #2d2c2c;
            --header-bg: rgba(45, 45, 45, 0.7);
            --border-color: #3b3a39;
            --shadow-color: rgba(0, 0, 0, 0.3);
            --overlay-color: rgba(0, 0, 0, 0.5);
        }

        /* ==================== 基础样式 ==================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family:
                'Open Sans',
                'Noto Sans SC',
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                "Helvetica Neue",
                Arial,
                sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color var(--transition-speed) var(--animation-curve),
                        color var(--transition-speed) var(--animation-curve);
            min-height: 100vh;
            position: relative;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--bg-color);
            opacity: 0.8;
            z-index: -1;
        }

        .header-right {
            display: flex !important;
            align-items: center;
            gap: 15px;
        }

        /* ==================== 容器 ==================== */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 120px 20px 20px;
            transition: padding var(--transition-speed) var(--animation-curve);
        }

        .container.scrolled {
            padding-top: 100px;
        }

        /* ==================== 头部/标题栏 ==================== */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--header-height);
            background: var(--header-bg);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            z-index: 1000;
            transition: all var(--transition-speed) var(--animation-curve);
            box-shadow: 0 2px 20px var(--shadow-color);
            border-bottom: 1px solid var(--border-color);
        }

        header.scrolled {
            height: 50px;
            box-shadow: 0 4px 20px var(--shadow-color);
        }

        header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.1) 0%,
                rgba(255, 255, 255, 0.05) 50%,
                rgba(255, 255, 255, 0.1) 100%
            );
            pointer-events: none;
            z-index: -1;
        }

        [data-theme="dark"] header::before {
            background: linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.05) 0%,
                rgba(255, 255, 255, 0.02) 50%,
                rgba(255, 255, 255, 0.05) 100%
            );
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        /* ==================== 标题文字 ==================== */
        h1, h2, h3, h4, h5, h6 {
            color: var(--text-color);
            transition: color var(--transition-speed) var(--animation-curve);
        }

        .navname1, .navname3, .navname5 {
            margin-left: 10px;
            font-weight: 700;
            background-color: transparent;
            color: var(--primary-color);
            font-size: 30px;
            transition: color var(--transition-speed) var(--animation-curve);
        }

        .navname2, .navname4, .navname6 {
            margin-left: 5px;
            font-weight: 700;
            height: 42px;
            color: white;
            font-size: 30px;
            background-color: var(--primary-color);
            border-radius: 10px;
            padding: 0 10px;
            display: inline-flex;
            align-items: center;
            transition: background-color var(--transition-speed) var(--animation-curve);
        }

        .insider-badge {
            display: none;
            font-size: 14px;
            font-weight: 600;
            color: var(--primary-color);
            background: rgba(var(--primary-color-rgb), 0.1);
            padding: 2px 8px;
            border-radius: 12px;
            margin-left: 8px;
            border: 1px solid rgba(var(--primary-color-rgb), 0.3);
            vertical-align: middle;
            animation: fadeIn 0.7s var(--animation-curve);
        }

        [data-theme="dark"] .insider-badge {
            background: rgba(var(--primary-color-rgb), 0.2);
            border: 1px solid rgba(var(--primary-color-rgb), 0.4);
        }

        /* ==================== 日期时间 ==================== */
        .datetime {
            font-size: 18px;
            color: var(--text-color);
            transition: color var(--transition-speed) var(--animation-curve);
        }

        /* ==================== 按钮 ==================== */
        button {
            font-family: inherit;
        }

        .btn {
            padding: 10px 15px;
            border: none;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-weight: 500;
            transition: all var(--transition-speed) var(--animation-curve);
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            transform: scale(1.05);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.6s var(--animation-curve);
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-secondary {
            background: var(--secondary-color);
            color: var(--text-color);
        }

        .settings-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            padding: 8px 12px;
            cursor: pointer;
            color: var(--text-color);
            transition: all var(--transition-speed) var(--animation-curve);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .settings-btn:hover {
            background: var(--secondary-color);
            transform: scale(1.05);
        }

        .search-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: var(--border-radius);
            padding: 12px 20px;
            cursor: pointer;
            font-size: 16px;
            transition: all var(--transition-speed) var(--animation-curve);
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 100px;
            justify-content: center;
        }

        .search-btn:hover {
            background: #106ebe;
            transform: scale(1.05);
        }

        /* ==================== 用户菜单 ==================== */
        .user-menu-container {
            position: relative;
            display: inline-block;
        }

        .login-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            padding: 8px 12px;
            cursor: pointer;
            color: var(--text-color);
            transition: all var(--transition-speed) var(--animation-curve);
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 120px;
            justify-content: space-between;
        }

        .login-btn:hover {
            background: var(--secondary-color);
            transform: scale(1.05);
        }

        #dropdownArrow {
            font-size: 12px;
            transition: transform 0.4s var(--animation-curve);
        }

        .user-dropdown {
            position: absolute;
            top: 100%;
            right: 0;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            box-shadow: 0 4px 12px var(--shadow-color);
            z-index: 1000;
            display: none;
            min-width: 220px;
            width: 100%;
            margin-top: 5px;
            animation: slideDown 0.4s var(--animation-curve);
            overflow: hidden;
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
        }

        .user-dropdown.active {
            display: block;
        }

        .user-info-section {
            padding: 16px;
            background: var(--secondary-color);
            border-bottom: 1px solid var(--border-color);
        }

        .user-nickname {
            font-size: 16px;
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 8px;
            text-align: center;
        }

        .user-certification {
            font-size: 12px;
            color: #ff6b35;
            background: rgba(255, 107, 53, 0.1);
            padding: 4px 8px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 8px;
            display: none;
        }

        .user-funds {
            font-size: 14px;
            color: var(--text-color);
            text-align: center;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .user-funds i {
            color: #ffd700;
        }

        .user-days {
            font-size: 12px;
            color: var(--text-color);
            opacity: 0.8;
            text-align: center;
            font-style: italic;
        }

        .dropdown-divider {
            height: 1px;
            background: var(--border-color);
            margin: 4px 0;
        }

        .dropdown-item {
            padding: 10px 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background-color 0.3s var(--animation-curve);
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            color: var(--text-color);
            font-size: 14px;
        }

        .dropdown-item:hover {
            background-color: var(--secondary-color);
        }

        .dropdown-item i {
            width: 16px;
            text-align: center;
            color: var(--primary-color);
        }

        /* ==================== 云母效果容器 ==================== */
        .section-container {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px var(--shadow-color);
            position: relative;
            overflow: hidden;
        }

        [data-theme="dark"] .section-container {
            background: rgba(45, 45, 45, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .section-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.1) 0%,
                rgba(255, 255, 255, 0.05) 50%,
                rgba(255, 255, 255, 0.1) 100%
            );
            pointer-events: none;
            border-radius: 16px;
        }

        [data-theme="dark"] .section-container::before {
            background: linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.05) 0%,
                rgba(255, 255, 255, 0.02) 50%,
                rgba(255, 255, 255, 0.05) 100%
            );
        }

        /* ==================== 搜索区域 ==================== */
        .search-container {
            max-width: 800px;
            margin: 0 auto 30px;
            position: relative;
        }

        .search-box-wrapper {
            display: flex;
            gap: 10px;
            align-items: stretch;
        }

        .search-box {
            flex: 1;
            padding: 12px 20px;
            font-size: 16px;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            box-shadow: 0 1px 2px var(--shadow-color);
            background: var(--card-bg);
            color: var(--text-color);
            transition: all var(--transition-speed) var(--animation-curve);
        }

        .search-box:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 1px var(--primary-color);
            transform: scale(1.01);
        }

        .suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-top: none;
            border-radius: 0 0 var(--border-radius) var(--border-radius);
            box-shadow: 0 2px 4px var(--shadow-color);
            z-index: 100;
            display: none;
            max-height: 300px;
            overflow-y: auto;
            animation: slideDown 0.4s var(--animation-curve);
        }

        .suggestion-item {
            padding: 12px 20px;
            cursor: pointer;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background-color 0.3s var(--animation-curve);
        }

        .suggestion-item:hover {
            background-color: var(--secondary-color);
        }

        .suggestion-item:last-child {
            border-bottom: none;
        }

        .suggestion-item i {
            color: var(--primary-color);
            width: 20px;
            text-align: center;
        }

        /* ==================== 卡片 ==================== */
        .card {
            background: var(--card-bg);
            border-radius: 6px;
            box-shadow: 0 1.6px 3.6px 0 var(--shadow-color), 0 0.3px 0.9px 0 var(--shadow-color);
            padding: 20px;
            transition: all var(--transition-speed) var(--animation-curve);
            cursor: pointer;
            animation: cardAppear 0.7s var(--animation-curve);
            position: relative;
            border: 1px solid transparent;
        }

        .card:hover {
            box-shadow: 0 3.2px 7.2px 0 var(--shadow-color), 0 0.6px 1.8px 0 var(--shadow-color);
            background-color: var(--card-hover-color);
            transform: translateY(-5px) scale(1.02);
            border-color: var(--primary-color);
        }

        .card h3 {
            margin: 0 0 10px 0;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 10px;
            transition: color var(--transition-speed) var(--animation-curve);
        }

        .card p {
            margin: 0;
            color: var(--text-color);
            font-size: 14px;
            word-break: break-all;
            opacity: 0.8;
            transition: color var(--transition-speed) var(--animation-curve);
        }

        /* ==================== 页脚 ==================== */
        footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px 0;
            color: var(--text-color);
            font-size: 14px;
            border-top: 1px solid var(--border-color);
            transition: color var(--transition-speed) var(--animation-curve);
        }

        /* ==================== 模态框 ==================== */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.4s var(--animation-curve);
        }

        .modal-content {
            background: var(--card-bg);
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 4px 8px var(--shadow-color);
            animation: modalAppear 0.5s var(--animation-curve);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
        }

        @keyframes modalAppear {
            from {
                opacity: 0;
                transform: scale(0.8) translateY(-20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .modal-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .modal-header h2 {
            margin: 0;
            color: var(--primary-color);
            transition: color var(--transition-speed) var(--animation-curve);
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--text-color);
            transition: all 0.3s var(--animation-curve);
            padding: 0;
            margin: 0;
        }

        .close-btn:hover {
            transform: scale(1.2);
        }

        .modal-body {
            padding: 20px;
        }

        /* ==================== 表单 ==================== */
        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: var(--card-bg);
            color: var(--text-color);
            transition: all 0.4s var(--animation-curve);
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary-color);
            transform: scale(1.01);
            box-shadow: 0 0 0 2px rgba(var(--primary-color-rgb), 0.2);
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        /* ==================== 动画 ==================== */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes slideInRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes slideOutRight {
            from {
                transform: translateX(0);
                opacity: 1;
            }
            to {
                transform: translateX(120%);
                opacity: 1;
            }
        }

        /* ==================== 响应式设计 ==================== */
        @media (max-width: 800px) {
            .container {
                padding-top: 100px;
            }

            .container.scrolled {
                padding-top: 80px;
            }

            header {
                padding: 0;
                height: 120px;
            }

            header.scrolled {
                height: 100px;
                box-shadow: 0 4px 20px var(--shadow-color);
            }

            .header-content {
                flex-direction: column;
                justify-content: center;
                gap: 5px;
            }

            .header-right {
                flex-direction: row;
                justify-content: center;
                gap: 10px;
            }

            .search-box-wrapper {
                flex-direction: column;
            }

            .search-btn {
                width: 100%;
            }

            .section-container {
                padding: 20px;
                margin: 15px;
                border-radius: 12px;
            }

            .insider-badge {
                font-size: 12px;
                padding: 1px 6px;
                margin-left: 6px;
            }

            .navname1, .navname2, .navname3, .navname4, .navname5, .navname6 {
                font-size: 24px;
            }

            .navname2, .navname4, .navname6 {
                height: 34px;
            }

            .modal-content {
                width: 95%;
            }
        }

        @media (max-width: 480px) {
            .section-container {
                padding: 15px;
                margin: 10px;
                border-radius: 10px;
            }

            .header-right {
                flex-wrap: wrap;
            }

            .datetime {
                font-size: 14px;
            }

            .navname1, .navname2, .navname3, .navname4, .navname5, .navname6 {
                font-size: 20px;
            }

            .navname2, .navname4, .navname6 {
                height: 28px;
            }

            .btn {
                padding: 8px 12px;
                font-size: 14px;
            }
        }

        /* ==================== 汉堡菜单 ==================== */
        .hamburger-btn {
            display: none;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            width: 36px;
            height: 28px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            border-radius: 6px;
            z-index: 1001;
            flex-shrink: 0;
        }

        .hamburger-btn span {
            display: block;
            width: 100%;
            height: 3px;
            background: var(--text-color);
            border-radius: 4px;
            transition: all var(--transition-speed) var(--animation-curve);
            transform-origin: center;
        }

    <!-- 【分区②】页面专属 CSS -->

</head>
