function randRange(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
function randFloat() { return Math.random(); }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function lerp(a, b, t) { return a + (b - a) * t; }
function rectHit(x1, y1, w1, h1, x2, y2, w2, h2) {
    return Math.abs(x1 - x2) < (w1 + w2) / 2 && Math.abs(y1 - y2) < (h1 + h2) / 2;
}
function dist(x1, y1, x2, y2) { return Math.hypot(x2 - x1, y2 - y1); }
function hexToRgb(hex) {
    const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    return {r,g,b};
}
function rgbToHex(r,g,b) {
    return '#' + [r,g,b].map(c => Math.min(255,Math.max(0,Math.round(c))).toString(16).padStart(2,'0')).join('');
}
function lighten(hex, amt) {
    const {r,g,b} = hexToRgb(hex);
    return rgbToHex(Math.min(255,r+amt), Math.min(255,g+amt), Math.min(255,b+amt));
}
function darken(hex, amt) { return lighten(hex, -amt); }

if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, radii) {
        const r = typeof radii === 'number' ? radii : (radii || 0);
        this.moveTo(x + r, y);
        this.lineTo(x + w - r, y);
        this.quadraticCurveTo(x + w, y, x + w, y + r);
        this.lineTo(x + w, y + h - r);
        this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        this.lineTo(x + r, y + h);
        this.quadraticCurveTo(x, y + h, x, y + h - r);
        this.lineTo(x, y + r);
        this.quadraticCurveTo(x, y, x + r, y);
        return this;
    };
}

// ===== 音频系统：支持外部 mp3 占位 =====
// 所有音频文件统一命名为 example.mp3，实际使用时替换为对应文件
// 音效映射：shoot, explode, hit, powerup, bomb, laser, levelup, fuse, bosswarn, gameover

// ===== 音频系统：支持外部 mp3 文件 =====
// ===== 音频系统：支持暂停/恢复背景音乐 =====
// ===== 音频系统：支持暂停/恢复背景音乐 =====
// ===== 音频系统：支持暂停音效 =====
// ===== 音频系统：支持暂停/恢复背景音乐 =====
// ===== 音频系统：支持外部 mp3 文件 =====
// ===== 音频系统：支持暂停/恢复背景音乐 =====
// ===== 音频系统：支持暂停音效 =====
// ===== 音频系统：精简修复版 =====
const AudioSystem = {
    ctx: null,
    muted: false,
    bgm: null,
    bgmType: null,
    bgmPaused: false,
    bgmCurrentTime: 0,
    bgmBeforePause: null,
    bgmBeforePauseTime: 0,

    // ★ 音效缓存（延迟加载）
    sfxCache: {},
    // ★ 活跃音效列表
    activeSounds: [],

    // 音效文件映射
    sfxFiles: {
        'shoot': 'shoot.mp3',
        'explode': 'explode.mp3',
        'hit': 'hit.mp3',
        'powerup': 'powerup.mp3',
        'bomb': 'bomb.mp3',
        'laser': 'laser.mp3',
        'levelup': 'levelup.mp3',
        'fuse': 'fuse.mp3',
        'bosswarn': 'empty.mp3',
        'gameover': 'gameover.mp3',
        'pause': 'empty.mp3',
        'resume': 'empty.mp3'
    },

    bgmFiles: {
        'menu': 'bgm_menu.mp3',
        'playing': 'bgm_playing.mp3',
        'boss': 'bgm_boss.mp3',
        'pause': 'bgm_pause.mp3'
    },

    init() {
        try {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            console.log('✅ 音频上下文已初始化');
        } catch(e) {
            console.warn('⚠️ 无法创建音频上下文:', e);
            this.ctx = null;
        }
    },

    // ★ 获取或创建音效（延迟加载，只请求一次）
    _getAudio(type) {
        // 从缓存获取
        if (this.sfxCache[type]) {
            return this.sfxCache[type];
        }

        const file = this.sfxFiles[type];
        if (!file) {
            console.warn(`⚠️ 未找到音效映射: ${type}`);
            return null;
        }

        // ★ 只在第一次请求时创建
        const audio = new Audio(file);
        audio.volume = 0.3;
        audio.preload = 'auto';
        
        // 缓存起来
        this.sfxCache[type] = audio;
        console.log(`📦 加载音效: ${type} (${file})`);
        
        return audio;
    },

    // ★ 播放音效（精简版）
    playSfx(type) {
        if (this.muted || !this.ctx) return;

        try {
            const audio = this._getAudio(type);
            if (!audio) return;

            // ★ 克隆节点实现同时播放
            const clone = audio.cloneNode();
            clone.volume = audio.volume;

            // 自动清理
            const cleanup = () => {
                const idx = this.activeSounds.indexOf(clone);
                if (idx > -1) this.activeSounds.splice(idx, 1);
                try { clone.remove(); } catch(e) {}
            };
            clone.onended = cleanup;
            clone.onerror = cleanup;

            const playPromise = clone.play();
            if (playPromise !== undefined) {
                playPromise.catch((e) => {
                    // ★ 静默处理错误，不弹出警告
                    cleanup();
                });
            }

            this.activeSounds.push(clone);
            
            // ★ 限制活跃音效数量（防止内存泄漏）
            if (this.activeSounds.length > 20) {
                const old = this.activeSounds.splice(0, this.activeSounds.length - 20);
                old.forEach(s => { try { s.pause(); s.remove(); } catch(e) {} });
            }

        } catch(e) {
            // ★ 完全静默，不影响游戏
        }
    },

    // ★ 播放背景音乐（精简版）
    playBgm(type, startTime = 0) {
        if (this.muted) {
            this.bgmType = type;
            return;
        }

        // 已在播放相同音乐
        if (this.bgmType === type && this.bgm && !this.bgm.paused) {
            return;
        }

        // 继续暂停的音乐
        if (this.bgmType === type && this.bgm && this.bgm.paused) {
            if (this.bgmCurrentTime > 0) {
                this.bgm.currentTime = this.bgmCurrentTime;
            }
            this.bgm.play().catch(() => {});
            this.bgmPaused = false;
            return;
        }

        // 停止并播放新的
        this.stopBgm();
        
        try {
            const file = this.bgmFiles[type];
            if (!file) return;
            
            this.bgm = new Audio(file);
            this.bgm.loop = true;
            this.bgm.volume = 0.2;
            
            if (startTime > 0) {
                this.bgm.currentTime = startTime;
            }
            
            this.bgm.play().catch(() => {});
            
            this.bgmType = type;
            this.bgmPaused = false;
            this.bgmCurrentTime = startTime;
            
        } catch(e) {
            // 静默失败
        }
    },

    // 暂停背景音乐
    pauseBgm() {
        if (this.bgm && !this.bgm.paused) {
            this.bgmCurrentTime = this.bgm.currentTime;
            this.bgm.pause();
            this.bgmPaused = true;
        }
    },

    // 恢复背景音乐
    resumeBgm() {
        if (this.muted) return;
        
        if (this.bgm && this.bgm.paused) {
            if (this.bgmCurrentTime > 0) {
                this.bgm.currentTime = this.bgmCurrentTime;
            }
            this.bgm.play().catch(() => {});
            this.bgmPaused = false;
        } else if (this.bgmType) {
            this.playBgm(this.bgmType);
        }
    },

    // 停止背景音乐
    stopBgm() {
        if (this.bgm) {
            this.bgm.pause();
            this.bgm = null;
        }
        this.bgmType = null;
        this.bgmPaused = false;
        this.bgmCurrentTime = 0;
    },

    // 暂停游戏音乐
    pauseGameMusic() {
        if (this.bgm && !this.bgm.paused) {
            this.bgmBeforePause = this.bgmType;
            this.bgmBeforePauseTime = this.bgm.currentTime;
            this.bgmCurrentTime = this.bgm.currentTime;
            this.bgm.pause();
            this.bgmPaused = true;
        } else if (this.bgmType) {
            this.bgmBeforePause = this.bgmType;
            this.bgmBeforePauseTime = this.bgmCurrentTime || 0;
        }
        
        this.stopBgm();
        this.playBgm('pause');
    },

    // 恢复游戏音乐
    resumeGameMusic() {
        this.stopBgm();
        const previousType = this.bgmBeforePause || 'playing';
        const previousTime = this.bgmBeforePauseTime || 0;
        this.bgmBeforePause = null;
        this.bgmBeforePauseTime = 0;
        this.playBgm(previousType, previousTime);
    },

    // 切换静音
    toggleMute() {
        this.muted = !this.muted;
        
        if (this.muted) {
            this.pauseBgm();
        } else {
            if (this.ctx && this.ctx.state === 'suspended') {
                this.ctx.resume();
            }
            this.resumeBgm();
        }
        
        return this.muted;
    },

    // 切换背景音乐
    switchBgm(type) {
        if (this.muted) {
            this.bgmType = type;
            return;
        }
        
        if (this.bgmType === type && this.bgm && !this.bgm.paused) {
            return;
        }
        
        this.stopBgm();
        this.playBgm(type);
    },

    // ★ 获取状态（用于调试）
    getStatus() {
        return {
            muted: this.muted,
            bgmType: this.bgmType,
            isPlaying: this.bgm && !this.bgm.paused,
            cachedSfx: Object.keys(this.sfxCache).length,
            activeSounds: this.activeSounds.length
        };
    },

    // ★ 清理资源
    dispose() {
        this.activeSounds.forEach(sound => {
            try { sound.pause(); sound.remove(); } catch(e) {}
        });
        this.activeSounds = [];
        
        for (const audio of Object.values(this.sfxCache)) {
            try { audio.pause(); audio.remove(); } catch(e) {}
        }
        this.sfxCache = {};
        
        this.stopBgm();
        
        if (this.ctx && this.ctx.state !== 'closed') {
            try { this.ctx.close(); } catch(e) {}
        }
        this.ctx = null;
    }
};

    weaponName(w) { return ['瓜摊号','自然空间号','总统号','终极引力号'][w] || '瓜摊号'; },

    ultName(u) { return ['镁条','三硝基甲𣿅','总统的一肚子坏水','臭𣿅','超音速𣿅弹','引力波','硝酸𣿅炸弹'][u] || ''; },

    skillDesc(s) { return ['炸毁全部敌机，重创 Boss','立即回复 40% 血量上限','获得一次伤害完全免疫','全场道具瞬间吸附到身边','清除屏幕上全部敌方弹幕','冻结所有敌机 2 秒','投放诱饵，吸收周围敌弹 4 秒','6 秒内攻击力 +40%','召唤僚机协同开火 8 秒'][s] || ''; },

    enemyName(t) { return ['玫瑰号','小王子号','镁条号','飞蛾号','装甲机','柯伊伯号','奥尔特号'][t] || ''; },
    enemyFeature(t) { return ['直线下移','高速直冲','下移+射击','正弦蛇形','厚甲慢速','锁定俯冲','横掠扫射'][t] || ''; },
    enemyHp(t,lv) {
